<!--
  ⚠⚠ THE URL IS THE FIX, NOT THE WORDING.

  Supabase's DEFAULT template is `{{ .ConfirmationURL }}`, which points at
  `{SUPABASE_URL}/auth/v1/verify?token=…&type=…&redirect_to=…`. Two things follow from that, and
  both of them broke account creation in production while working perfectly in development:

    1. THAT URL CONSUMES THE ONE-TIME TOKEN WHEN IT IS FETCHED. Corporate mail security (Outlook
       Safe Links and friends) fetches every link in a message before the human sees it — so the
       token is spent, and the person's click gets `?error=access_denied&error_code=otp_expired`.
       A local Mailpit inbox has no scanner, so this never shows up in development.
    2. IT COMES BACK AS `?code=`, WHICH IS PKCE. Only the browser that REQUESTED the link holds the
       code verifier, so opening the mail on a phone after asking on a laptop cannot work. In
       development there is only ever one browser.

  `token_hash` + `verifyOtp` (see `frontend/app/auth/confirm/route.ts`) has neither problem: nothing
  is consumed until our own route runs, and there is no per-browser state to carry.

  ⚠ `{{ .SiteURL }}` must be the deployed origin. Keep the same URL in the Supabase dashboard for
  the hosted project — this file only configures the LOCAL stack.
-->
<h2>Sign in to BBTerminal</h2>
<p>Click the link below to sign in. It works once and expires in an hour.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type={{ .Email_Action_Type }}">
    Sign in to BBTerminal
  </a>
</p>
<p>If you did not request this, you can ignore this email.</p>
